services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: carbonlab_opc
      POSTGRES_USER: carbonlab_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_for_local_only}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U carbonlab_user -d carbonlab_opc"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - carbonlab_pgdata:/var/lib/postgresql/data

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      APP_ENV: development
      DATABASE_URL: postgresql+psycopg2://carbonlab_user:${POSTGRES_PASSWORD:-change_me_for_local_only}@db:5432/carbonlab_opc
      JWT_SECRET: ${JWT_SECRET:-local_development_only_replace_before_sharing}
      CORS_ALLOWED_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
      STORAGE_BACKEND: local
      LLM_API_BASE: ${LLM_API_BASE:-https://api.example.invalid/v1}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-replace_with_approved_model}
    command: ["sh", "-c", "alembic -c backend/alembic.ini upgrade head && uvicorn backend.main:app --host 0.0.0.0 --port 8000"]
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - carbonlab_uploads:/app/uploads

  frontend:
    build:
      context: ./frontend
    environment:
      VITE_API_PROXY_TARGET: http://backend:8000
    depends_on:
      - backend
    ports:
      - "5173:5173"

volumes:
  carbonlab_pgdata:
  carbonlab_uploads:
