name: carbonlab_competition_demo

services:
  db:
    image: carbonlab-offline-postgres-slim:${CARBONLAB_IMAGE_TAG}
    platform: ${CARBONLAB_PLATFORM}
    pull_policy: never
    environment:
      POSTGRES_DB: carbonlab_opc
      POSTGRES_USER: carbonlab_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U carbonlab_user -d carbonlab_opc"]
      interval: 3s
      timeout: 3s
      retries: 40
    volumes:
      - carbonlab_demo_pgdata:/var/lib/postgresql/data

  backend:
    image: carbonlab-offline-backend:${CARBONLAB_IMAGE_TAG}
    platform: ${CARBONLAB_PLATFORM}
    pull_policy: never
    environment:
      APP_ENV: development
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_APP_USER}:${POSTGRES_APP_PASSWORD}@db:5432/carbonlab_opc
      DATABASE_MIGRATION_URL: postgresql+psycopg2://carbonlab_user:${POSTGRES_PASSWORD}@db:5432/carbonlab_opc
      POSTGRES_APP_USER: ${POSTGRES_APP_USER}
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      CORS_ALLOWED_ORIGINS: http://localhost:${FRONTEND_PORT},http://127.0.0.1:${FRONTEND_PORT}
      STORAGE_BACKEND: local
      LOCAL_STORAGE_DIR: /app/uploads
      CARBONLAB_DEMO_PASSWORD: ${CARBONLAB_DEMO_PASSWORD}
      LLM_API_BASE: https://api.example.invalid/v1
      LLM_API_KEY: ""
      LLM_MODEL: offline-not-configured
      EMBEDDING_MODEL: offline-local-feature-hash
      RAG_EMBEDDING_PROVIDER: local_hash
      RAG_EMBEDDING_DIMENSIONS: 1536
    command:
      - sh
      - -c
      - >-
        python -m scripts.prepare_database_role &&
        DATABASE_URL="$$DATABASE_MIGRATION_URL" alembic -c backend/alembic.ini upgrade head &&
        python -m scripts.prepare_database_role --grant &&
        DATABASE_URL="$$DATABASE_MIGRATION_URL" python -m scripts.seed_passport_demo &&
        uvicorn backend.offline_entry:app --host 0.0.0.0 --port 8000
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import json,urllib.request;
          data=json.load(urllib.request.urlopen('http://127.0.0.1:8000/api/health',timeout=3));
          raise SystemExit(0 if data.get('status') == 'ok' else 1)
      interval: 3s
      timeout: 4s
      retries: 60
    ports:
      - "${FRONTEND_PORT}:8000"
      - "${BACKEND_PORT}:8000"
    volumes:
      - carbonlab_demo_uploads:/app/uploads

volumes:
  carbonlab_demo_pgdata:
  carbonlab_demo_uploads:
